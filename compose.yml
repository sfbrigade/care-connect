services:
  db:
    image: postgres:17.6
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - 5432:5432
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - care-connect
  mail:
    image: dockage/mailcatcher:0.9.0
    ports:
      - 1025:1025
      - 1080:1080
    networks:
      - care-connect
  storage:
    # Built locally from the official MinIO release binaries; MinIO no longer
    # publishes images to Docker Hub. See docker/minio/Dockerfile.
    build: ./docker/minio
    image: care-connect-minio:RELEASE.2025-09-07T16-13-09Z
    command: server --console-address ":9001" /data
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - ./data/minio:/data
    networks:
      - care-connect
  storage-setup:
    # Same local image as `storage`; it bundles the `mc` client.
    build: ./docker/minio
    image: care-connect-minio:RELEASE.2025-09-07T16-13-09Z
    depends_on:
      - storage
    entrypoint: >
      /bin/sh -c "
      sleep 1;
      mc alias set myminio http://storage:9000 minioadmin minioadmin;
      mc mb --ignore-existing myminio/app;
      exit 0;
      "
    networks:
      - care-connect
networks:
  care-connect:
    name: care-connect
    driver: bridge
